# GRPO for Qwen3.8-27B (thinking) on NeMo Gym environments, one node of 8 GPUs, with LoRA.
#
# Defaults chosen for target-rl:
# - Async GRPO with separate pools: 6 GPUs generate (vLLM TP2, three replicas), 2 GPUs train (Megatron TP2).
#   Rollouts may be one step stale (max_trajectory_age_steps), corrected by importance sampling.
# - Dr. GRPO advantages: reward minus the group mean, without dividing by the group std.
# Synchronous colocated training on all 8 GPUs instead: ++grpo.async_grpo.enabled=false
#   ++policy.generation.colocated.enabled=true ++policy.megatron_cfg.pipeline_model_parallel_size=2
#   ++policy.megatron_cfg.tensor_model_parallel_size=4 ++policy.generation.vllm_cfg.tensor_parallel_size=4
#   (dynamic sampling, which drops groups whose rollouts all score the same, only applies in that mode:
#   ++grpo.use_dynamic_sampling=true).
#
# Model and parallelism follow examples/configs/recipes/llm/grpo-qwen3.8-27b-2n8g-megatron-tp4pp2cp2.yaml, which
# trains every weight on two nodes.
#
# This file runs the toy tool-calling environment (smoke test); grpo_qwen3.8_27b_biodiscovery_overfit*.yaml inherit it
# for the drug-target environment.

defaults: "../grpo_workplace_assistant_nemotron_nano_v2_9b.yaml"

grpo:
  # The smoke dataset holds 5 tasks; raise this with the real dataset (contracts.BatchManifest uses 64).
  num_prompts_per_step: 4
  num_generations_per_prompt: 8
  val_period: 10
  val_at_start: false
  # Dr. GRPO: mean-only advantage over the whole group (no std division, no leave-one-out baseline). Groups whose
  # rollouts all score the same get zero advantage and so contribute no gradient.
  normalize_rewards: false
  use_leave_one_out_baseline: false
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    max_generation_failures: 0
    in_flight_weight_updates: false
    recompute_kv_cache_after_weight_updates: true

loss_fn:
  # Required by async GRPO: corrects for rollouts generated by weights up to max_trajectory_age_steps old.
  use_importance_sampling_correction: true

checkpointing:
  checkpoint_dir: results/target-rl-qwen3.8-27b-1n8g
  metric_name: "val:accuracy"
  save_period: 10

policy:
  model_name: Qwen/Qwen3.8-27B
  tokenizer:
    chat_template_kwargs:
      enable_thinking: true
  max_total_sequence_length: 32768
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}

  megatron_cfg:
    # Two training GPUs.
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    activation_checkpointing: true
    apply_rope_fusion: false
    defer_fp32_logits: true
    # Required by MegatronConfig; the inherited Gym tutorial config predates the field. Dense model, so off.
    moe_per_layer_logging: false
    peft:
      enabled: true
      target_modules: []
      exclude_modules: []
      dim: 128
      alpha: 128
      dropout: 0.0
      dropout_position: "post"
      lora_A_init_method: "xavier"
      lora_B_init_method: "zero"
      a2a_experimental: false
      lora_dtype: None
      restore_from: null

  generation:
    lora_refit_mode: merged
    colocated:
      # Separate inference pool: 6 of the node's 8 GPUs generate, the other 2 train.
      enabled: false
      resources:
        gpus_per_node: 6
        num_nodes: null
    vllm_cfg:
      async_engine: true
      tensor_parallel_size: 2
      # The generation GPUs hold no training state.
      gpu_memory_utilization: 0.85
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: qwen3_coder
        reasoning_parser: qwen3

data:
  train:
    data_path: 3rdparty/Gym-workspace/Gym/target_rl/data/smoke/train.jsonl
  validation:
    data_path: 3rdparty/Gym-workspace/Gym/target_rl/data/smoke/validation.jsonl

env:
  nemo_gym:
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - resources_servers/example_single_tool_call/configs/example_single_tool_call.yaml
    # The base recipe's environments; null reads as absent (an override cannot delete an inherited key).
    workplace_assistant_environment_server: null
    code_gen: null
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: true
          extra_body:
            chat_template_kwargs:
              enable_thinking: true

logger:
  log_dir: logs/target-rl-qwen3.8-27b-1n8g
  wandb_enabled: false
  tensorboard_enabled: true
  wandb:
    project: target-rl
    name: qwen3.8-27b-1n8g

cluster:
  gpus_per_node: 8
  num_nodes: 1
